services:

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: cardiotwin-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - cardiotwin-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3

  engine:
    build:
      context: ./services/engine
      dockerfile: Dockerfile
    container_name: cardiotwin-engine
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC_RAW=cardiotwin/telemetry/raw
      - MQTT_TOPIC_PRED=cardiotwin/telemetry/predictions
      - DB_PATH=/data/cardiotwin.db
      - MODEL_PATH=/app/model.pkl
      - DATASET_PATH=/seed/framingham.csv
      - PYTHONUNBUFFERED=1
    volumes:
      - shared-data:/data
      - ./data:/seed:ro
    networks:
      - cardiotwin-net
    restart: unless-stopped

  emulator:
    build:
      context: ./services/emulator
      dockerfile: Dockerfile
    container_name: cardiotwin-emulator
    depends_on:
      mosquitto:
        condition: service_healthy
      engine:
        condition: service_started
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC_RAW=cardiotwin/telemetry/raw
      - DATASET_PATH=/data/framingham.csv
      - PUBLISH_INTERVAL=1.0
      - NOISE_SIGMA=2.0
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/data:ro
    networks:
      - cardiotwin-net
    restart: unless-stopped

  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
    container_name: cardiotwin-dashboard
    depends_on:
      engine:
        condition: service_started
    environment:
      - DB_PATH=/data/cardiotwin.db
      - INDEX_PATH=/app/static/index.html
      - HISTORY_LEN=60
      - PYTHONUNBUFFERED=1
    volumes:
      - shared-data:/data:ro
      - ./index.html:/app/static/index.html:ro
    networks:
      - cardiotwin-net
    restart: unless-stopped

  dashboard-st:
    build:
      context: ./services/dashboard-st
      dockerfile: Dockerfile
    container_name: cardiotwin-dashboard-st
    depends_on:
      engine:
        condition: service_started
    environment:
      - STREAMLIT_SERVER_BASE_URL_PATH=/streamlit
      - DB_PATH=/data/cardiotwin.db
      - PYTHONUNBUFFERED=1
    volumes:
      - shared-data:/data:ro
    networks:
      - cardiotwin-net
    restart: unless-stopped

  watchdog:
    build:
      context: ./services/watchdog
      dockerfile: Dockerfile
    container_name: cardiotwin-watchdog
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - MQTT_BROKER=mosquitto
      - DB_PATH=/data/cardiotwin.db
    volumes:
      - shared-data:/data
    networks:
      - cardiotwin-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: cardiotwin-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dashboard
      - dashboard-st
    networks:
      - cardiotwin-net
    restart: unless-stopped

networks:
  cardiotwin-net:
    driver: bridge

volumes:
  mosquitto-data:
  mosquitto-log:
  shared-data:
