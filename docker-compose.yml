version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  emulator:
    build: ./services/emulator
    container_name: cardiotwin-emulator
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
    volumes:
      - ./data:/data

  engine:
    build: ./services/engine
    container_name: cardiotwin-engine
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
    volumes:
      - ./data:/data

  dashboard:
    build: ./services/dashboard
    container_name: cardiotwin-dashboard
    ports:
      - "8501:8501"
    depends_on:
      - mosquitto
      - engine
    environment:
      - MQTT_BROKER=mosquitto

volumes:
  mosquitto_data:
  mosquitto_log:
