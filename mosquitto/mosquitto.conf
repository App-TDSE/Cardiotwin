# Mosquitto config para CardioTwin (entorno académico, sin TLS)
# Para producción agregar TLS y autenticación con password_file.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

connection_messages true
log_timestamp true

max_queued_messages 1000
message_size_limit 0
