name: Deploy to Azure

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: 'Log in to Azure Container Registry'
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 'Build and push Engine'
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/cardiotwin-engine:latest ./services/engine
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/cardiotwin-engine:latest

      - name: 'Build and push Emulator'
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/cardiotwin-emulator:latest ./services/emulator
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/cardiotwin-emulator:latest

      - name: 'Build and push Dashboard'
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/cardiotwin-dashboard:latest ./services/dashboard
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/cardiotwin-dashboard:latest

      - name: 'Build and push Streamlit'
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/cardiotwin-dashboard-st:latest ./services/dashboard-st
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/cardiotwin-dashboard-st:latest

      - name: 'Build and push Watchdog'
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/cardiotwin-watchdog:latest ./services/watchdog
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/cardiotwin-watchdog:latest

      - name: 'Build and push Nginx'
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/cardiotwin-nginx:latest ./nginx
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/cardiotwin-nginx:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: 'Log in to Azure'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'cardiotwin-app'
          configuration-file: 'docker-compose.azure.yml'
