events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;

        # FastAPI / HTML Dashboard
        location / {
            proxy_pass http://dashboard:8501/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Streamlit main app
        location /streamlit/ {
            proxy_pass http://dashboard-st:8501/streamlit/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 86400;
        }

        # Streamlit healthcheck
        location ^~ /streamlit/healthz {
            proxy_pass http://dashboard-st:8501/streamlit/healthz;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Streamlit websocket/_stcore routing
        location ^~ /streamlit/_stcore/ {
            proxy_pass http://dashboard-st:8501/streamlit/_stcore/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 86400;
        }
    }
}
